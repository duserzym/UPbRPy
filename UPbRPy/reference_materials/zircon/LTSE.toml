role = "concentration"
unit = "ug/g"
status = "provisional"
source = "deer2013"
notes = "Elemental mass fraction assigned to the {quantity} measurement channel; value is not multiplied by the isotope abundance. Average zircon composition. LTSE is the SLZC megacryst of Hu et al. (2023)."

