# Only documented inputs are stored; redundant ratios are derived in Python.
format_version = 2
material = "zircon"

[standards."LTSE"]
aliases = []

[[standards."LTSE".measurements]]
role = "concentration"
unit = "ug/g"
status = "provisional"
source = "deer2013"
notes = "Elemental mass fraction assigned to the {quantity} measurement channel; value is not multiplied by the isotope abundance. Average zircon composition. The UPbR26plus archive cites Hu et al. (2023) (source hu2023) for LTSE at 560.9 Ma. That paper characterises three Sri Lankan megacrysts named SLZA, SLZB and SLZC (CA-ID-TIMS 206Pb/238U 556.94, 552.90 and 560.83 Ma, each ± 1.29 Ma); none is named LTSE, and the archive values do not match any of them exactly. Values are the archive's until the Boise lab confirms the source."

