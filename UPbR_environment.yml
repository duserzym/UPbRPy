name: UPbRPy
channels:
  - conda-forge
dependencies:
  # Python 3.14 is the current stable feature release. Package versions are
  # sourced from pyproject.toml so this file does not duplicate a brittle
  # platform-specific Conda export.
  - python=3.14
  - pip>=26.1.2
  - pip:
      - -e .[gui,dev]
