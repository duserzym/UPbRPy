[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "UPbRPy"
version = "0.1.0"
description = "Python LA-ICP-MS U-Pb and trace-element reduction toolkit with an optional PySide6 desktop GUI."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
  {name = "UPbRPy contributors"}
]
dependencies = [
  "numpy>=2.5.1",
  "pandas>=3.0.3",
  "scipy>=1.18.0",
  "matplotlib>=3.11.0",
  "bokeh>=3.9.1"
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.11.1",
  "pyqtgraph>=0.14.0"
]
notebook = [
  "ipykernel>=7.3.0",
  "jupyter_bokeh>=4.1.0",
  "panel>=1.8.10"
]
export = [
  "cairosvg>=2.8.2",
  "selenium>=4.39.0",
  "xlsxwriter>=3.2.9"
]
dev = [
  "ipykernel>=7.3.0",
  "jupyterlab>=4.6.1",
  "jupyter_bokeh>=4.1.0",
  "panel>=1.8.10",
  "cairosvg>=2.8.2",
  "selenium>=4.39.0",
  "xlsxwriter>=3.2.9",
  "pytest>=9.1.1",
  "ruff>=0.15.21"
]

[project.scripts]
upbrpy-gui = "GUI.main:main"

[tool.setuptools.packages.find]
include = ["UPbRPy*", "GUI*"]

[tool.setuptools.package-data]
UPbRPy = [
  "standards.csv",
  "reference_materials/*.toml",
  "reference_materials/*/*.toml",
]

[tool.setuptools.exclude-package-data]
UPbRPy = ["standards_v2.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
