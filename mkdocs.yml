site_name: UPbRPy Studio manual
site_description: Installation, reduction workflow, Python API and data model for UPbRPy Studio.
site_url: https://duserzym.github.io/UPbRPy/
repo_url: https://github.com/duserzym/UPbRPy
repo_name: duserzym/UPbRPy
docs_dir: docs
theme:
  name: material
  logo: assets/upbrpy.png
  favicon: assets/upbrpy.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips
extra_css:
  - stylesheets/extra.css
plugins:
  - search
markdown_extensions:
  - tables
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: [docs/includes]
      auto_append: [abbreviations.md]
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
exclude_docs: |
  /includes/**
  /notes/**
  /perf/**
  /qtegra_input_plan.md
  /verification_*.md
  /lab_workflow_integration.md
  /manuscript_workflow_compatibility.md
  /standards_v2.md
nav:
  - Home: index.md
  - Get started:
      - Install: get-started/install.md
      - First launch: get-started/first-launch.md
      - Open a session: get-started/open-session.md
      - Updates: get-started/updates.md
  - Manual:
      - Import and auto-pick windows: manual/import.md
      - Review baseline and plateau picks: manual/selections.md
      - Subtract baseline: manual/baseline.md
      - Internal normalization: manual/normalization.md
      - Calibrate and calculate concentrations: manual/concentrations.md
      - Build raw isotope ratios: manual/ratios.md
      - Downhole correction: manual/downhole.md
      - Session fractionation correction: manual/session.md
      - Dates and concordia review: manual/final-results.md
      - Spot concordia: manual/concordia.md
      - Depth-profile export: manual/depth-profiles.md
      - Export results: manual/export.md
      - Database: manual/database.md
      - Keyboard shortcuts: manual/keyboard-shortcuts.md
  - Concepts:
      - Key ideas: guide/key-ideas.md
      - Counting and dwell time: guide/counting-and-dwell.md
      - Choosing an export: guide/choosing-an-export.md
      - Uncertainty and publication exports: uncertainty_and_publication_exports.md
      - Regression methods: isochron_regression.md
  - Reference:
      - Data model: data-model/index.md
      - Rich single CSV: data-model/rich-csv.md
      - Per-spot CSV and folder: data-model/per-spot.md
      - Acquisition model: data-model/acquisition-model.md
      - Reference materials: data-model/reference-materials.md
      - Projects and bundles: data-model/project-and-bundle.md
      - Export table: data-model/export-table.md
      - Publication table contract: export_table_spec.md
      - Qtegra exports decision: qtegra_export_formats.md
      - Python API: reference/python-api.md
  - Development:
      - Building Studio: development/building.md
      - Tests: testing.md
      - In-app updates and releases: in-app-updates.md
      - Contributing: development/contributing.md
      - Manual screenshots: development/screenshots.md
