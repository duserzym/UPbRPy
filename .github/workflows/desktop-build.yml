name: Build desktop applications

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-14
          - label: Windows x86_64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install application and build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[gui,build]" "pytest>=9.1.1"

      - name: Run source tests
        run: python -m pytest -q

      - name: Build, launch-test, and archive
        run: python scripts/build_desktop.py --archive --dist-dir "${{ runner.temp }}/upbrpy-dist" --work-dir "${{ runner.temp }}/upbrpy-work"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: UPbRPy-Studio-${{ matrix.label }}
          path: ${{ runner.temp }}/upbrpy-dist/UPbRPy-Studio-*.zip
          if-no-files-found: error
          retention-days: 14
